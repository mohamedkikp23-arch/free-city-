#wanted .wanted-star.on{color:#fbbf24;-webkit-text-stroke:.5px #fff0a6;text-shadow:0 0 5px #f59e0b99,0 0 12px #f59e0b66;filter:drop-shadow(0 0 2px #f59e0b66)}

#wanted.wanted-hot .wanted-star.on:nth-child(2){animation-delay:.035s}
#wanted.wanted-hot .wanted-star.on:nth-child(3){animation-delay:.07s}
#wanted.wanted-hot .wanted-star.on:nth-child(4){animation-delay:.105s}
#wanted.wanted-hot .wanted-star.on:nth-child(5){animation-delay:.14s}
#wanted.wanted-active .wanted-star.on{animation:starThreat 1.25s ease-in-out infinite}
#wanted.wanted-max .wanted-star.on{color:#fb7185;-webkit-text-stroke:.5px #fecdd3;text-shadow:0 0 6px #fb7185,0 0 15px #ef4444aa;animation:starMax .72s ease-in-out infinite alternate}

@keyframes starIgnite{0%{transform:scale(.45) rotate(-24deg);opacity:.3}65%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes starThreat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes starMax{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.18);filter:brightness(1.55)}}
@media(prefers-reduced-motion:reduce){#wanted .wanted-star,#wanted.wanted-hot .wanted-star.on,#wanted.wanted-active .wanted-star.on,#wanted.wanted-max .wanted-star.on{animation:none!important;transition:none!important}}

@keyframes tShake{0%,100%{translate:0 0}25%{translate:-5px 0}75%{translate:5px 0}}

<script>
// Try to enter fullscreen + landscape on a deliberate user tap. Browser support varies for local HTML files.
(()=>{
 const prompt=document.getElementById('landscapePrompt');
 const btn=document.getElementById('landscapeStart');
 const note=document.getElementById('landscapeNote');
 const isVert=()=>document.documentElement.classList.contains('vert');
 const wrongNow=()=>isVert()?matchMedia('(orientation:landscape)').matches:matchMedia('(orientation:portrait)').matches;
 const texts=()=>isVert()
  ?{aria:'تشغيل اللعبة بالوضع العمودي',icon:'📱',h:'Free City — الوضع العمودي',p:'دوّر الموبايل للطول عشان الأزرار والخريطة تتظبط.',b:'تشغيل بالطول',n:'لو الموبايل بالعرض، لفّه للوضع العمودي.'}
  :{aria:'تشغيل اللعبة بالوضع الأفقي',icon:'📱 ↻',h:'Free City — الوضع الأفقي',p:'خلّي اللعبة بالعرض عشان مساحة اللعب والتحكم يبقوا أوضح.',b:'تشغيل بالعرض',n:'لو الموبايل مدخلش الوضع الأفقي تلقائيًا، لفّه بإيدك.'};
 const update=()=>{
  if(!prompt)return;
  const t=texts();
  prompt.setAttribute('aria-label',t.aria);
  prompt.querySelector('.rotate-icon').textContent=t.icon;
  prompt.querySelector('h2').textContent=t.h;
  prompt.querySelector('p').textContent=t.p;
  btn.textContent=t.b;
  if(note&&!note.dataset.custom)note.textContent=t.n;
  prompt.style.display='none';
 };
 window.fcApplyOrient=async(mode,tryLock)=>{
  document.documentElement.className=mode==='vert'?'vert':'horiz';
  if(note)delete note.dataset.custom;
  if(tryLock){
   try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(e){}
   try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock(mode==='vert'?'portrait':'landscape');}catch(e){}
  }
  setTimeout(()=>{update();window.dispatchEvent(new Event('resize'))},200);
 };
 addEventListener('orientationchange',()=>setTimeout(update,150));
 addEventListener('resize',update);
 btn?.addEventListener('click',async()=>{
   await window.fcApplyOrient(isVert()?'vert':'horiz',true);
   setTimeout(()=>{
     update();
     if(wrongNow()&&note){note.dataset.custom='1';note.textContent=isVert()?'المتصفح مش بيسمح بقفل الاتجاه هنا؛ لفّ الموبايل للطول يدويًا.':'المتصفح مش بيسمح بقفل الاتجاه هنا؛ لفّ الموبايل بالعرض يدويًا.'}
   },250);
 });
 update();
})();
// Runtime compatibility fallback for road-rendering code.
var half = 0;

(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
const LOW_POWER_DEVICE=matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const PERF={lite:false,dpr:LOW_POWER_DEVICE?1.35:2};
function resize(){
 dpr=Math.min(devicePixelRatio||1,PERF.dpr);
 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

const WORLD=3600,BLOCK=300,ROAD_W=88;
// شوارع فرعية ضيقة وشوارع رئيسية عريضة كل 3 بلوكات، بروح تخطيط مدن GTA.
const roadWidthAt=(gridIndex)=>[136,104,120][((gridIndex%3)+3)%3];
const nearestGridIndex=(v)=>Math.round(v/BLOCK);
const nearestGridDistance=(v)=>{const m=((v%BLOCK)+BLOCK)%BLOCK;return Math.min(m,BLOCK-m)};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

/* هل النقطة على شارع؟ */
function isOnRoad(x,y,pad=0){
 const gx=nearestGridIndex(x),gy=nearestGridIndex(y);
 const dx=nearestGridDistance(x),dy=nearestGridDistance(y);
 return dx<=roadWidthAt(gx)/2+pad || dy<=roadWidthAt(gy)/2+pad;
}
/* أقرب مركز شارع — دايمًا على خط المنتصف */
function snapToRoad(x,y){
 const gx=Math.round(x/BLOCK)*BLOCK;
 const gy=Math.round(y/BLOCK)*BLOCK;
 const dx=Math.abs(x-gx),dy=Math.abs(y-gy);
 // لو قريب من تقاطع، خليه في المركز
 if(dx<ROAD_W*.6&&dy<ROAD_W*.6)return{x:gx,y:gy};
 if(dx<=dy)return{x:gx,y:y}; // شارع رأسي (x ثابت)
 return{x:x,y:gy}; // شارع أفقي (y ثابت)
}
/* حارة يمين حسب الاتجاه (رايح / جاي زي GTA) */
const LANE=ROAD_W*0.22;
function laneOffset(angle){
 return{x:Math.cos(angle+Math.PI/2)*LANE,y:Math.sin(angle+Math.PI/2)*LANE};
}
function stayInLane(c){
 const gx=Math.round(c.x/BLOCK)*BLOCK;
 const gy=Math.round(c.y/BLOCK)*BLOCK;
 const dx=Math.abs(c.x-gx),dy=Math.abs(c.y-gy);
 if(dx<ROAD_W*.5&&dy<ROAD_W*.5)return; // تقاطع
 const off=laneOffset(c.angle);
 const lane=(Math.abs(Math.cos(c.angle))<0.5?roadWidthAt(Math.round(gx/BLOCK)):roadWidthAt(Math.round(gy/BLOCK)))*.25;
 const laneOff={x:Math.cos(c.angle+Math.PI/2)*lane,y:Math.sin(c.angle+Math.PI/2)*lane};
 if(Math.abs(Math.cos(c.angle))<0.5){
  c.x+=(gx+laneOff.x-c.x)*.45;
 }else{
  c.y+=(gy+laneOff.y-c.y)*.45;
 }
}
function spawnOnLane(x,y,angle){
 const sn=snapToRoad(x,y);
 const vertical=Math.abs(Math.cos(angle))<0.5;
 const wi=vertical?roadWidthAt(Math.round(sn.x/BLOCK)):roadWidthAt(Math.round(sn.y/BLOCK));
 const lane=wi*.25;
 const off={x:Math.cos(angle+Math.PI/2)*lane,y:Math.sin(angle+Math.PI/2)*lane};
 return{x:sn.x+off.x,y:sn.y+off.y};
}
function roadAngle(){
 return [0,Math.PI/2,Math.PI,-Math.PI/2][Math.random()*4|0];
}
/* تصادم دقيق: مستطيل العربية المدوّر (OBB) ضد المبنى (SAT) — بيرجّع متجه الدفع بره المبنى */
function obbVsRect(x,y,a,hw,hh,b){
 const r=Math.hypot(hw,hh);
 if(x+r<b.x||x-r>b.x+b.w||y+r<b.y||y-r>b.y+b.h)return null;
 const cs=Math.cos(a),sn=Math.sin(a),bw=b.w/2,bh=b.h/2;
 const dx=x-(b.x+bw),dy=y-(b.y+bh);
 const axes=[[1,0],[0,1],[cs,sn],[-sn,cs]];
 let best=1e9,mx=0,my=0;
 for(const [ax,ay] of axes){
  const rc=Math.abs(cs*ax+sn*ay)*hw+Math.abs(-sn*ax+cs*ay)*hh;
  const rb=Math.abs(ax)*bw+Math.abs(ay)*bh;
  const d=dx*ax+dy*ay,ov=rc+rb-Math.abs(d);
  if(ov<=0)return null;
  if(ov<best){best=ov;const sg=d<0?-1:1;mx=ax*sg;my=ay*sg}
 }
 return{x:mx*best,y:my*best};
}
function pushCarOutOfBuildings(c){
 const hw=c.w/2-2,hh=c.h/2-2;
 for(let k=0;k<4;k++){
  let moved=false;
  for(const b of buildings){
   const m=obbVsRect(c.x,c.y,c.angle,hw,hh,b);
   if(m){c.x+=m.x*1.02;c.y+=m.y*1.02;moved=true}
  }
  if(!moved)break;
 }
}
function pushCircleOutOfBuildings(o){
 for(let k=0;k<3;k++){
  let moved=false;
  for(const b of buildings){
   const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h);
   const ddx=o.x-cx,ddy=o.y-cy,d=Math.hypot(ddx,ddy);
   if(d>=o.r)continue;
   moved=true;
   if(d>0.001){o.x+=ddx/d*(o.r-d+.5);o.y+=ddy/d*(o.r-d+.5)}
   else{ // المركز جوه المبنى: اطلع من أقرب ضلع
    const l=o.x-b.x,r2=b.x+b.w-o.x,t=o.y-b.y,bt=b.y+b.h-o.y,m=Math.min(l,r2,t,bt);
    if(m===l)o.x=b.x-o.r-1;else if(m===r2)o.x=b.x+b.w+o.r+1;else if(m===t)o.y=b.y-o.r-1;else o.y=b.y+b.h+o.r+1;
   }
  }
  if(!moved)break;
 }
}
function hitsAnyBuilding(x,y,hw=20,hh=12){
 return buildings.some(b=>x+hw>b.x&&x-hw<b.x+b.w&&y+hh>b.y&&y-hh<b.y+b.h);
}

/* صوت */
let actx=null;
let gameSettings={sound:true,graphics:'high',shake:true,bigControls:false,miniMap:true,orient:'vert'};
try{gameSettings={...gameSettings,...JSON.parse(localStorage.getItem('cjGameSettings')||'{}')}}catch(e){}
function saveSettings(){try{localStorage.setItem('cjGameSettings',JSON.stringify(gameSettings))}catch(e){}}
function ensureAudio(){
 if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(actx&&actx.state==='suspended')actx.resume();
}
function beep(freq,dur,type='square',vol=.08){
 if(!gameSettings.sound)return;
 ensureAudio();if(!actx)return;
 const o=actx.createOscillator(),g=actx.createGain();
 o.type=type;o.frequency.value=freq;
 g.gain.setValueAtTime(vol,actx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
 o.connect(g);g.connect(actx.destination);
 o.start();o.stop(actx.currentTime+dur);
}
function sfxShoot(){const w=player.weapon;
 if(w===1){beep(70,.12,'sawtooth',.08);beep(130,.06,'square',.05)}
 else if(w===2){beep(210+Math.random()*30,.035,'square',.04)}
 else if(w===3){beep(520,.04,'square',.05);beep(60,.25,'sawtooth',.06)}
 else if(w===4){beep(95,.35,'sawtooth',.07);beep(180,.2,'triangle',.04)}
 else if(w===6){beep(250,.025,'square',.035)}
 else{beep(180+Math.random()*40,.05,'square',.05);beep(90,.03,'sawtooth',.03)}}
function sfxHit(){beep(140,.07,'triangle',.06)}
function sfxPickup(){beep(520,.07,'sine',.07);beep(780,.1,'sine',.05)}
function sfxExplode(){beep(55,.28,'sawtooth',.11);beep(35,.35,'square',.07)}
function sfxWanted(){beep(440,.09,'square',.05);beep(330,.11,'square',.04)}
function sfxMission(){beep(400,.07,'sine',.07);beep(600,.09,'sine',.06);beep(800,.12,'sine',.05)}

/* مباني — جوه البلوك فقط، بعيد عن الشارع */
const buildings=[];
const PAD=ROAD_W/2+14; // مسافة أمان من الشارع
for(let gx=0;gx<WORLD;gx+=BLOCK){
 for(let gy=0;gy<WORLD;gy+=BLOCK){
  const cx=gx+BLOCK/2,cy=gy+BLOCK/2;
  if(Math.hypot(cx-WORLD/2,cy-WORLD/2)<380)continue; // ميدان في الوسط
  const bi=gx/BLOCK,bj=gy/BLOCK;
  const padL=roadWidthAt(bi)/2+14,padR=roadWidthAt(bi+1)/2+14,padT=roadWidthAt(bj)/2+14,padB=roadWidthAt(bj+1)/2+14;
  const maxW=BLOCK-padL-padR,maxH=BLOCK-padT-padB;
  if(maxW<50||maxH<50)continue;
  const w=maxW-rand(0,18),h=maxH-rand(0,18);
  // تمركز جوه البلوك مع هامش
  const x=gx+padL+(maxW-w)*0.5;
  const y=gy+padT+(maxH-h)*0.5;
  buildings.push({
   x,y,w,h,
   c:['#1c2836','#243040','#2a2838','#1f3028','#262b36'][Math.random()*5|0],
   roof:['#354554','#38424c','#3e3848','#34423a'][Math.random()*4|0],
   helipad:Math.random()<.08,
   lights:Math.random()<.5
  });
 }
}

  const candidates=[
   {x:gx+hl,y:gy+BLOCK*0.3},{x:gx+hl,y:gy+BLOCK*0.7},
   {x:gx+BLOCK-hr,y:gy+BLOCK*0.3},{x:gx+BLOCK-hr,y:gy+BLOCK*0.7},

   {x:gx+BLOCK*0.3,y:gy+BLOCK-hb},{x:gx+BLOCK*0.7,y:gy+BLOCK-hb}

 }

// نظام التاكسي: العلامة الصفراء تتبع شخصًا حقيقيًا من المدنيين، ثم تظهر وجهته بعد ركوبه.
function randomTaxiStop(avoidX=null,avoidY=null,minDistance=0){
 let p={x:WORLD/2,y:WORLD/2};
 for(let i=0;i<100;i++){
  p=randomRoadPos();
  if((avoidX==null||dist(p.x,p.y,avoidX,avoidY)>=minDistance)&&!hitsAnyBuilding(p.x,p.y,14,10))return p;
 }
 return p;
}
function makeTaxiPassengerNear(x,y){
 let p=randomTaxiStop(x,y,220);
 // إزاحة بسيطة من منتصف الشارع ناحية الرصيف، ثم نتأكد أنه ليس داخل مبنى.
 const side=Math.random()<.5?-1:1;
 const candidate={x:p.x+side*(ROAD_W*.5+13),y:p.y,r:10,angle:rand(0,Math.PI*2),speed:rand(.25,.55),health:40,
  color:['#ffb86c','#f472b6','#a3e635','#c4b5fd','#67e8f9'][Math.random()*5|0],
  shirt:['#1d4ed8','#b91c1c','#15803d','#7c3aed','#0891b2'][Math.random()*5|0],style:Math.random()*5|0,wander:rand(.5,2),crossing:false,panic:0};
 if(!hitsAnyBuilding(candidate.x,candidate.y,10,10))p=candidate;
 const passenger={...p, taxiPassenger:true};
 civilians.push(passenger);
 return passenger;
}
function findTaxiPassenger(x,y,minDistance=180){
 let best=null,bestD=Infinity;
 for(const person of civilians){
  if(person.health<=0||person.taxiPassenger||person.vip)continue;
  const d=dist(x,y,person.x,person.y);
  if(d>=minDistance&&d<bestD){best=person;bestD=d;}
 }
 return best||makeTaxiPassengerNear(x,y);
}
function startTaxiShift(){
 if(!player.inCar||player.inCar.type!=='taxi'){
  notify('🚕 لازم تركب عربية تاكسي الأول!');return;
 }
 if(taxiJob.active){
  taxiJob.active=false;taxiJob.phase='pickup';taxiJob.pickup=null;taxiJob.destination=null;taxiJob.tripStart=null;
  notify(`انتهى شغل التاكسي · ${taxiJob.fares} رحلات · $${taxiJob.totalEarned} أرباح`);
  updateUI();return;
 }
 taxiJob.active=true;taxiJob.phase='pickup';
 taxiJob.pickup=findTaxiPassenger(player.inCar.x,player.inCar.y,180);
 taxiJob.destination=null;taxiJob.tripStart=null;
 notify('🚕 وردية التاكسي بدأت! اتبع العلامة الصفراء فوق الشخص المطلوب، وقرّب منه بالعربية.');
 updateUI();
}
function updateTaxiJob(){
 if(!taxiJob.active||!player.inCar||player.inCar.type!=='taxi')return;
 const c=player.inCar;
 if(taxiJob.phase==='pickup'){
  // لو الراكب اتصاب أو اختفى، عيّن شخصًا آخر بدل ترك المهمة معلّقة.
  if(!taxiJob.pickup||taxiJob.pickup.health<=0||!civilians.includes(taxiJob.pickup)){
   taxiJob.pickup=findTaxiPassenger(c.x,c.y,180);
   notify('🚕 الراكب غادر المكان؛ تم تحديد راكب جديد باللون الأصفر.');
  }
  if(taxiJob.pickup&&dist(c.x,c.y,taxiJob.pickup.x,taxiJob.pickup.y)<43&&Math.abs(c.speed||0)<1.8){
   const passenger=taxiJob.pickup;
   const idx=civilians.indexOf(passenger);
   if(idx>=0)civilians.splice(idx,1); // الراكب يدخل التاكسي ويختفي من الرصيف
   taxiJob.tripStart={x:c.x,y:c.y,t:elapsed};
   taxiJob.pickup=null;
   taxiJob.destination=randomTaxiStop(c.x,c.y,650);
   taxiJob.phase='dropoff';
   notify('🧍 الراكب ركب التاكسي! اتبع العلامة الخضراء لتوصيله لوجهته.');
   sfxPickup();updateUI();
  }
 }else if(taxiJob.phase==='dropoff'&&taxiJob.destination){
  if(dist(c.x,c.y,taxiJob.destination.x,taxiJob.destination.y)<48&&Math.abs(c.speed||0)<1.8){
   const start=taxiJob.tripStart||c;
   const tripDistance=dist(start.x,start.y,taxiJob.destination.x,taxiJob.destination.y);
   const tip=(elapsed-(start.t||elapsed))<tripDistance/130?60:0;
   const fare=Math.round(clamp(90+tripDistance*.12,120,420))+tip;
   if(tip)floatText(c.x,c.y-50,'بقشيش سرعة +$60','#4ade80');
   taxiJob.fares++;taxiJob.totalEarned+=fare;
   addCash(fare);player.score+=fare;
   floatText(c.x,c.y-32,'أجرة +$'+fare,'#fde047');
   notify(`💵 وصلت الراكب لوجهته! الأجرة $${fare} · إجمالي الرحلات ${taxiJob.fares}`);
   sfxMission();
   taxiJob.phase='pickup';taxiJob.destination=null;taxiJob.tripStart=null;
   taxiJob.pickup=findTaxiPassenger(c.x,c.y,240);
   updateUI();
  }
 }
}
function drawTaxiJobMarker(){
 if(!taxiJob.active)return;
 const target=taxiJob.phase==='pickup'?taxiJob.pickup:taxiJob.destination;
 if(!target)return;
 const pulse=1+Math.sin(elapsed*5)*.14;
 const color=taxiJob.phase==='pickup'?'#facc15':'#4ade80';
 ctx.save();ctx.translate(target.x,target.y);
 ctx.globalAlpha=.16;ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,34*pulse,0,Math.PI*2);ctx.fill();
 ctx.globalAlpha=.95;ctx.strokeStyle=color;ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(0,0,21*pulse,0,Math.PI*2);ctx.stroke();
 ctx.globalAlpha=1;ctx.fillStyle='#071018';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.save();ctx.scale(.85,.85);markerIcon(taxiJob.phase==='pickup'?'person':'flag',color,'#071018');ctx.restore();
 ctx.font='bold 12px sans-serif';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=5;
 ctx.fillText(taxiJob.phase==='pickup'?'اركب الراكب':'وجهة الراكب',0,-35);
 ctx.restore();
}

function notify(s){
 const el=document.getElementById('toast');
 if(!el)return;
 const message=String(s??'');
 const lower=message.toLowerCase();
 let type='info',icon='✦',title='إشعار';
 if(/فشل|❌|🚫|مش كفاية|متقدرش|لازم|الأول|انتهت الذخيرة|هتنفجر|ولعت/.test(message)){
   type='danger';icon='!';title='تنبيه';
 }else if(/警|🚨|🚔|شرطة|إنذار|حاجز|مطلوب|مطاردة|اهرب|انفجار/.test(message)){
   type='warn';icon='⚠';title='تحذير';
 }else if(/اكتملت|تم |وصلت|سرقت المحل|أرباح|استعدت|ممتلئ|لبست|ركبت|بدأت|تركيب|تطوير/.test(message)||/💰|💵|🏆|✅|🎉/.test(message)){
   type='success';icon='✓';title='تم بنجاح';
 }
 el.className='';
 el.classList.add(type,'show');
 el.style.setProperty('--tc',type==='success'?'#4ade80':type==='danger'?'#fb7185':type==='warn'?'#fbbf24':'#7dd3fc');
 el.replaceChildren();
 const wrap=document.createElement('div');wrap.className='tw';
 const badge=document.createElement('span');badge.className='ti';badge.setAttribute('aria-hidden','true');badge.textContent=icon;
 const content=document.createElement('div');content.className='toastContent';
 const heading=document.createElement('span');heading.className='toastTitle';heading.textContent=title;
 const text=document.createElement('span');text.className='tt';text.textContent=message;
 content.append(heading,text);wrap.append(badge,content);el.append(wrap);
 el.setAttribute('role',type==='danger'||type==='warn'?'alert':'status');
 el.setAttribute('aria-live',type==='danger'||type==='warn'?'assertive':'polite');
 el.style.display='block';toastTimer=3.2;
}

function checkMission(){

  player.cash+=m.reward;totalCashEarned+=m.reward;player.score+=m.reward;

function rectCircleCollision(o){
 for(const b of buildings){
  const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h);
  if((o.x-cx)**2+(o.y-cy)**2<o.r*o.r)return true;
 }
 return false;
}
function carBlockRadius(c){
 return Math.hypot((c.w||48)*.38,(c.h||26)*.38)*0.9;
}
function hitsCarBody(o){
 for(const c of [...cars,...police]){
  if(c.explodeTimer!=null)continue;
  if(c===player.inCar)continue;
  if(dist(o.x,o.y,c.x,c.y)<o.r+carBlockRadius(c))return c;
 }
 return null;
}
function pushOutOfCars(o){
 // لو محشور بين عربيات — ادفعه برا
 for(let k=0;k<4;k++){
  const hit=hitsCarBody(o);
  if(!hit)break;
  const d=dist(o.x,o.y,hit.x,hit.y)||0.1;
  const push=o.r+carBlockRadius(hit)+2;
  o.x=hit.x+(o.x-hit.x)/d*push;
  o.y=hit.y+(o.y-hit.y)/d*push;
  o.x=clamp(o.x,o.r,WORLD-o.r);
  o.y=clamp(o.y,o.r,WORLD-o.r);
 }
}
function moveCircle(o,dx,dy){
 const ox=o.x,oy=o.y;
 o.x=clamp(o.x+dx,o.r,WORLD-o.r);
 if(rectCircleCollision(o)||hitsCarBody(o))o.x=ox;
 o.y=clamp(o.y+dy,o.r,WORLD-o.r);
 if(rectCircleCollision(o)||hitsCarBody(o))o.y=oy;
 // لو لسه جوه عربية (محشور) ادفع برا
 if(hitsCarBody(o))pushOutOfCars(o);
 pushCircleOutOfBuildings(o);
 o.x=clamp(o.x,o.r,WORLD-o.r);o.y=clamp(o.y,o.r,WORLD-o.r);
}

function hitRadius(e){
 if(e.r)return e.r+4;
 // سيارات وشرطة — نصف قطر أكبر عشان الضرب يشتغل
 return Math.max(e.w||48,e.h||26)*0.52;
}

function ensurePatrolPolice(){

 let guard=0;
 while(n()<need&&guard++<12)spawnPolice({patrol:true});
 // امسح الدوريات الزيادة البعيدة
 if(n()>need+3){
  for(let i=police.length-1;i>=0&&n()>need;i--){
   const q=police[i];
   if(q.patrol&&!q.block&&!q.chase&&dist(q.x,q.y,player.x,player.y)>800)police.splice(i,1);
  }
 }
}

function startStory(id){story.active=true;story.id=id;story.step=-1;story.t=0;story.obj=null;story.safe=null;story.drop=null;nextStoryStep()}
function nextStoryStep(){
 const def=STORIES[story.id];
 story.step++;story.t=0;mission.progress=story.step;
 if(story.step>=def.stages.length){
  if(def.onDone)def.onDone();
  story.active=false;checkMission();return;
 }
 const st=def.stages[story.step];
 if(st.onStart)st.onStart();
 const pm=(STAGE_MSG[story.id]||{})[story.step];if(pm)phoneMsg(pm[0],pm[1]);
 notify('🎯 '+st.text);sfxMission();updateUI();
}
function failStory(msg){
 if(!story.active)return;
 story.active=false;
 if(story.obj&&story.obj.story)story.obj.story=false;
 mission.active=false;mission.index=-1;mission.progress=0;
 notify('❌ فشلت المهمة: '+msg);updateUI();
}
function storyTick(dt){
 if(!story.active)return;
 const st=curStage();if(!st)return;
 const tp=st.pos?st.pos():null;
 if(story.obj&&story.obj.story&&(story.obj.explodeTimer!=null||story.obj.health<=0)&&(st.type==='getcar'||st.needObj)){failStory('العربية اتدمرت');return}
 if(st.type==='reach'){
  if(tp&&dist(player.x,player.y,tp.x,tp.y)<st.r&&(!st.needObj||player.inCar===story.obj))nextStoryStep();
 }else if(st.type==='hold'){
  if(tp&&dist(player.x,player.y,tp.x,tp.y)<st.r&&(!st.onFoot||!player.inCar)){story.t+=dt;if(story.t>=st.time)nextStoryStep()}
  else story.t=Math.max(0,story.t-dt*.5);
 }else if(st.type==='getcar'){
  if(player.inCar===story.obj)nextStoryStep();
 }else if(st.type==='kill'){
  if(!story.obj||story.obj.health<=0)nextStoryStep();
 }
}

function raiseWanted(n=1){
 // النجوم بطيئة جداً زي GTA: كل جريمة بتزود "سخونة" بس، والنجمة بتيجي لما السخونة تكمل 100
 const heatAdd=n>=2?45:18;
 player.heat=(player.heat||0)+heatAdd;
 player._heatIdle=0;
 if(player.heat<100){updateUI();return}
 // متزيدش أكتر من نجمة كل 12 ثانية
 if(player._lastWantedGain&&(performance.now()-player._lastWantedGain)<12000){player.heat=99;updateUI();return}
 player.heat=0;
 const prev=player.wanted;
 player.wanted=clamp(player.wanted+1,0,5);
 player.wantedTimer=Math.max(player.wantedTimer,40+player.wanted*15);
 if(player.wanted>=3)spawnHeli();
 if(player.wanted>prev){
  player._lastWantedGain=performance.now();
  sfxWanted();wantedFlash=1.2;
  alertNearbyPolice(520);
  if(player.wanted>=5)unlockAch('wanted5','مطلوب رقم 1 — 5 نجوم!');
 }
 updateUI();
}

  player.heat=(player.heat||0)+40;

 }
 player._lastForceStar=now;

  player._lastWantedGain=now;
  sfxWanted();wantedFlash=1.4;
  alertNearbyPolice(560);
  if(reason)notify(reason);

 }

function inView(x,y,margin=80){

function shoot(){

  if(now-player.lastShot>800){player.lastShot=now;notify('🚫 خلصت الذخيرة — 🔄 غيّر السلاح');}
  return;
 }
 if(now-player.lastShot<w.rate)return;
 player.lastShot=now;
 if(w.ammo!==Infinity)w.ammo--;
 const origin=player.inCar||player;
 const a=player.angle;
 const muzzle=player.inCar?32:26;
 for(let i=0;i<(w.pellets||1);i++){
  const aa=a+rand(-w.spread,w.spread);
  bullets.push({
   x:origin.x+Math.cos(a)*muzzle,y:origin.y+Math.sin(a)*muzzle,
   vx:Math.cos(aa)*w.speed,vy:Math.sin(aa)*w.speed,
   damage:w.damage*(1+upgrades.damage*.14),life:w.life||80,explosive:!!w.explosive,grenade:!!w.grenade,
   owner:'player',color:w.color
  });
 }
 particles.push({x:origin.x+Math.cos(a)*(muzzle+2),y:origin.y+Math.sin(a)*(muzzle+2),life:.1,max:.1,color:'#ffe27a',size:11});
 // اهتزاز الكاميرا مع الضرب بس
 shake=Math.max(shake,2.2+(w.explosive?4:0));
 sfxShoot();
 // ذعر المدنيين القريبين
 for(const c of civilians){
  if(dist(c.x,c.y,origin.x,origin.y)<180){
   c.panic=2.5+Math.random()*2;
   c.angle=Math.atan2(c.y-origin.y,c.x-origin.x)+rand(-.4,.4);
   c.speed=1.4+Math.random()*.6;
  }
 }
 updateUI();
}

function explode(x,y,damage){
 explosions.push({x,y,r:8,max:110,life:.4});
 sfxExplode();
 let killedCop=false,killedCiv=false;
 for(const e of [...civilians,...police,...cars]){
  if(dist(e.x,e.y,x,y)<110){
   const was=e.health;
   e.health-=damage;
   e.flash=0.35;
   if(cars.includes(e)&&e.health<=0&&e.explodeTimer==null){e.health=0;e.explodeTimer=e===player.inCar?3.2:2.2;e.speed=0;e.smokeTimer=0}
   if(was>0&&e.health<=0){
    if(e.isPolice){
     killedCop=true;
     if(mission.active&&missions[mission.index]?.kind==='police'){mission.progress++;checkMission()}
     player.cash+=65;totalCashEarned+=65;totalKills++;
    }else if(civilians.includes(e)&&!e.gang){
     killedCiv=true;
    }
   }
  }
 }
 if(killedCop)raiseWanted(2);
 else if(killedCiv)raiseWanted(1);
 for(let i=0;i<16;i++){
  particles.push({
   x:x+rand(-22,22),y:y+rand(-22,22),
   life:.3+Math.random()*.35,max:.5,
   color:['#ff6b35','#fbbf24','#f97316','#7c8793'][i%4],
   size:rand(4,16)
  });
 }
}

function damageTarget(e,amount){
 const wasAlive=e.health>0;
 const prevH=e.health;
 e.health-=amount;
 e.flash=0.4;
 sfxHit();
 particles.push({x:e.x+rand(-6,6),y:e.y+rand(-6,6),life:.2,max:.2,color:'#ff6b6b',size:rand(5,10)});
 floatText(e.x,e.y-14,'-'+Math.floor(amount),'#fca5a5');

 if(cars.includes(e)&&e!==player.inCar&&wasAlive&&prevH>=100){
  raiseWanted(1);
 }
 if(cars.includes(e)&&e.health<=0&&e.explodeTimer==null){
  e.health=0;e.explodeTimer=e===player.inCar?3.2:2.2;e.speed=0;e.smokeTimer=0;
  if(e===player.inCar)notify('🔥 العربية ولعت! اطلع بسرعة قبل ما تنفجر!');
  else notify('السيارة هتنفجر — ابعد!');
 }
 if(civilians.includes(e)&&wasAlive&&e.health<=0){
  e.health=0;
  particles.push({x:e.x,y:e.y,life:.3,max:.3,color:'#fbbf24',size:11});
  if(Math.random()<.5)spawnPickup('cash',e.x,e.y);
  if(!e.gang)raiseWanted(1);
  player.combo=player.comboTimer>0?player.combo+1:1;
  player.comboTimer=3;
  const pts=50*player.combo;
  player.score+=pts;totalKills++;
  floatText(e.x,e.y-28,'+'+pts+(player.combo>1?' x'+player.combo:''),'#fbbf24');
  unlockAch('firstKill','أول ضحية!');
  if(player.combo>=5)unlockAch('combo5','كومبو x5!');
 }
 if(e.isPolice&&wasAlive){
  if(e.health<=0){
   raiseWanted(2);
   player.combo=player.comboTimer>0?player.combo+1:1;
   player.comboTimer=3.5;
   const pts=150*player.combo;
   player.score+=pts;totalKills++;
   floatText(e.x,e.y-28,'+'+pts+' شرطة','#60a5fa');
   unlockAch('firstKill','أول ضحية!');
   if(player.combo>=5)unlockAch('combo5','كومبو x5!');
  }else if(prevH>=100)raiseWanted(1);
 }
}

function toggleCar(){
 if(player.inCar){
  const c=player.inCar;
  if(c.type==='taxi'&&taxiJob.active){
   taxiJob.active=false;taxiJob.pickup=null;taxiJob.destination=null;taxiJob.tripStart=null;taxiJob.phase='pickup';
   notify('انتهت وردية التاكسي لأنك نزلت من العربية.');
  }
  // انزل على جنب العربية بعيد عن الاصطدام
  let ang=c.angle+Math.PI/2;
  player.inCar=null;c.parked=true;c.speed=0;c.vx=0;c.vy=0;
  let placed=false;
  for(const rad of [48,62,80]){
   for(let i=0;i<16&&!placed;i++){
    const a=ang+i*(Math.PI/8),t={x:c.x+Math.cos(a)*rad,y:c.y+Math.sin(a)*rad,r:player.r};
    if(t.x>20&&t.y>20&&t.x<WORLD-20&&t.y<WORLD-20&&!hitsCarBody(t)&&!rectCircleCollision(t)){player.x=t.x;player.y=t.y;placed=true}
   }
  }
  if(!placed){const sn=snapToRoad(c.x,c.y);player.x=sn.x;player.y=sn.y}
  pushOutOfCars(player);pushCircleOutOfBuildings(player);
  notify('نزلت من السيارة');
  updateUI();
  return;
 }
 // ممنوع ركوب عربيات الشرطة
 for(const p of police){
  if(dist(p.x,p.y,player.x,player.y)<55){
   notify('🚔 دي عربية شرطة — متقدرش تركبها!');
   return;
  }
 }
 let nearest=null,best=70;
 for(const c of cars){
  if(c.explodeTimer!=null||c.isPolice)continue;
  if(c.type==='ambulance'||c.type==='firetruck')continue; // إسعاف ومطافي
  const d=dist(c.x,c.y,player.x,player.y);
  if(d<best){nearest=c;best=d}
 }
 if(nearest){
  player.inCar=nearest;
  nearest.stolen=true;nearest.parked=false;
  nearest.speed=0;
  player.x=nearest.x;player.y=nearest.y;
  player.boost=player.boostMax;
  if(!nearest.owned&&police.some(q=>!q.block&&dist(q.x,q.y,nearest.x,nearest.y)<320))raiseWanted(1);
  notify('ركبت! 🚀 نيترو · Shift جري');
  unlockAch('firstCar','أول عربية مسروقة!');
  updateUI();
 }else notify('اقترب من سيارة مدنية');
}

function buyOwnedVehicle(typeId,cost,label){
 if(player.inCar){notify('انزل من العربية الأول عشان تشتري مركبة');return}
 if(player.cash<cost){notify('فلوس مش كفاية — محتاج $'+cost);return}
 const t=CAR_TYPES.find(v=>v.id===typeId);
 if(!t){notify('المركبة دي مش متاحة');return}
 // Spawn close to player, slightly ahead, and avoid building interiors.
 let x=player.x+Math.cos(player.angle||0)*72;
 let y=player.y+Math.sin(player.angle||0)*72;
 if(hitsAnyBuilding(x,y,t.w*.42,t.h*.42)){
  x=player.x+Math.cos((player.angle||0)+Math.PI/2)*82;
  y=player.y+Math.sin((player.angle||0)+Math.PI/2)*82;
 }
 if(hitsAnyBuilding(x,y,t.w*.42,t.h*.42)){x=player.x;y=player.y}
 player.cash-=cost;
 const car={x,y,w:t.w,h:t.h,type:t.id,angle:player.angle||0,speed:0,maxSpeed:t.max[1],health:typeId==='armored'?260:typeId==='truck'?160:(typeId==='moto'?70:100),isPolice:false,stolen:false,explodeTimer:null,smokeTimer:0,vx:0,vy:0,mass:t.mass,flash:0,turnTimer:2,plate:makePlate(),owned:true};
 cars.push(car);player.inCar=car;player.x=x;player.y=y;player.boost=player.boostMax;
 document.getElementById('modal').style.display='none';
 notify('تم شراء '+label+'! مبروك 🚘');sfxMission();updateUI();
}

function saveGame(silent){
 const data={
  player:{x:player.x,y:player.y,health:player.health,armor:player.armor,cash:player.cash,wanted:player.wanted,weapon:player.weapon,boost:player.boost},
  mission,driveStartDist,weaponAmmo:weapons.map(w=>w.ammo===Infinity?null:w.ammo),
  totalKills,totalCashEarned,carSpeeds:cars.map(c=>c.maxSpeed),upgrades:{...upgrades},outfit:player.outfit|0,ownedOutfits
 };
 try{localStorage.setItem('cityCrimeSave2',JSON.stringify(data));if(!silent)notify('تم الحفظ')}catch(e){if(!silent)notify('تعذر الحفظ')}

function loadGame(){
 try{
  const raw=localStorage.getItem('cityCrimeSave2')||localStorage.getItem('cityCrimeSave');
  if(!raw){notify('لا يوجد حفظ');return}
  const d=JSON.parse(raw);
  Object.assign(player,d.player||{});
  player.inCar=null;
  Object.assign(mission,d.mission||{});
  story.active=false;
  if(mission.active&&missions[mission.index]&&missions[mission.index].kind==='story'){mission.active=false;mission.index=-1;mission.progress=0}
  driveStartDist=d.driveStartDist||0;
  totalKills=d.totalKills||0;
  totalCashEarned=d.totalCashEarned||0;
  Object.assign(upgrades,d.upgrades||{});
  if(Array.isArray(d.ownedOutfits))ownedOutfits=OUTFITS.map((o,i)=>i===0||!!d.ownedOutfits[i]);
  player.outfit=ownedOutfits[d.outfit|0]?(d.outfit|0):0;
  player.boostMax=3.5+upgrades.nitro*1.2;
  (d.weaponAmmo||[]).forEach((a,i)=>{if(a!==null&&weapons[i])weapons[i].ammo=a});
  if(d.carSpeeds)cars.forEach((c,i)=>{if(d.carSpeeds[i])c.maxSpeed=d.carSpeeds[i]});
  updateUI();notify('تم التحميل');
 }catch(e){notify('ملف غير صالح')}
}

function damagePlayer(n){

 }
 player.health-=n;
 sfxHit();
 if(n>0)floatText(player.x,player.y-18,'-'+Math.floor(n),'#f87171');
 if(player.health<=30&&!lowHpWarned){
  lowHpWarned=true;
  notify('❤️ صحتك ضعيفة — دور على كشك أو جراج!');
 }
 if(player.health>40)lowHpWarned=false;
 if(player.health<=0){
  player.health=0;
  document.getElementById('goStats').textContent=
   `قتلت ${totalKills} · كسبت $${Math.floor(totalCashEarned)} · مهام ${mission.done} · نقاط ${Math.floor(player.score)}`;
  document.getElementById('gameover').style.display='flex';
 }
 updateUI();
}

/* محرك الحوار: lines = [['g'|'p',نص] أو ['c',[[نص,مفتاح],...]]] */
function runChat(o){
 const modal=document.getElementById('modal'),box=document.getElementById('modalBox');
 modal.style.display='flex';
 const lines=o.lines.slice();
 const col=o.color||(GIVER_LOOKS[o.name]||{}).top||'#475569';
 let idx=0,timer=null,full='',pos=0;
 const close=()=>{clearInterval(timer);modal.style.display='none'};
 const head=isG=>`<h2 style="margin:0 0 8px">💬 ${isG?o.name:'CJ'}</h2>`;
 const bubble=(isG,id)=>`<div style="display:flex;gap:10px;align-items:center;margin:8px 0">
   <div style="flex:0 0 54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,${isG?col:'#16a34a'}cc,${isG?col:'#16a34a'}55);border:2px solid ${isG?'#fbbf24':'#4ade80'};display:grid;place-items:center;font-size:26px">${isG?'🕶️':'🧢'}</div>
   <div id="${id}" style="flex:1;min-height:84px;padding:12px 14px;border-radius:14px;background:${isG?'#1e293b':'#052e16'};border:1px solid ${isG?'#fbbf2488':'#4ade8088'};font-size:15px;line-height:1.7;text-align:start"></div></div>`;
 function show(){
  clearInterval(timer);
  const ln=lines[idx];
  if(ln[0]==='c'){
   box.innerHTML=`<h2 style="margin:0 0 8px">💬 اختار ردّك</h2>`+ln[1].map((k,i)=>`<button class="menuBtn" id="ch${i}">${k[0]}</button>`).join('');
   ln[1].forEach((k,i)=>document.getElementById('ch'+i).onclick=()=>{
    const extra=(o.onChoice?o.onChoice(k[1]):null)||[];
    lines.splice(idx,1,['p',k[0]],...extra);show();
   });
   return;
  }
  const isG=ln[0]==='g',last=idx===lines.length-1;
  full=ln[1];pos=0;
  box.innerHTML=head(isG)+bubble(isG,'dlgTxt')+
   `<p class="hint" style="text-align:center">${'●'.repeat(idx+1)}${'○'.repeat(Math.max(0,lines.length-idx-1))}</p>`+
   (last?((o.endHtml?`<p style="text-align:center">${o.endHtml}</p>`:'')+(o.onAccept?`<button class="menuBtn" id="chAcc">${o.acceptLabel||'قبول'}</button><button class="menuBtn secondary" id="chLater">${o.laterLabel||'بعدين'}</button>`:`<button class="menuBtn" id="chLater">${o.closeLabel||'تمام'}</button>`))
   :`<button class="menuBtn" id="dlgNext">التالي ◀</button><button class="menuBtn secondary" id="dlgSkip">تخطّي الكلام</button>`);
  const el=document.getElementById('dlgTxt');
  const finish=()=>{clearInterval(timer);el.textContent=full;pos=full.length};
  timer=setInterval(()=>{if(!document.body.contains(el)){clearInterval(timer);return}pos++;el.textContent=full.slice(0,pos);if(pos>=full.length)clearInterval(timer)},24);
  el.onclick=finish;
  if(!last){
   document.getElementById('dlgNext').onclick=()=>{if(pos<full.length){finish();return}idx++;show()};
   document.getElementById('dlgSkip').onclick=()=>{let j=idx+1;while(j<lines.length-1&&lines[j][0]!=='c')j++;idx=j;show()};
  }else{
   document.getElementById('chLater').onclick=close;
   if(o.onAccept)document.getElementById('chAcc').onclick=()=>{clearInterval(timer);modal.style.display='none';o.onAccept()};
  }
 }
 show();
}

  ['c',[['مضمون يا باشا، هخلّصها','ok'],['عايز أكتر من كده في الفلوس','more']]],
  ['g',GIVER_BYE[g.name]||'يلا بينا.']];
 g._bonus=0;
 runChat({name:g.name,lines,endHtml:`<b>${m.title}</b> · <span style="color:#4ade80">$${m.reward}</span>`,acceptLabel:'قبول المهمة',laterLabel:'بعدين',
  onChoice:key=>{
   if(key==='ok'){player.cash+=100;updateUI();return [['g','عارف إنك قدها. خد $100 مقدّم على الحساب.']]}

   return [['g','لأ يا CJ، خد أو سيب. الرقم ده نهائي.']];
  },
  onAccept:()=>{

function resolveVehicleCollisions(dt){
 const fleet=[...cars,...police];
 for(let i=0;i<fleet.length;i++){
  const a=fleet[i];a.vx=a.vx||0;a.vy=a.vy||0;
  for(let j=i+1;j<fleet.length;j++){
   const b=fleet[j];b.vx=b.vx||0;b.vy=b.vy||0;
   if(a.isPolice||b.isPolice)continue; // الشرطة ليها فيزياء مخصوصة (policePhysics)
   const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001;
   const limit=(Math.max(a.w||48,a.h||27)+Math.max(b.w||48,b.h||27))*.36;
   if(d>=limit)continue;
   const nx=dx/d,ny=dy/d,overlap=limit-d;
   const ma=a.mass||1,mb=b.mass||1,total=ma+mb;
   a.x-=nx*overlap*mb/total;a.y-=ny*overlap*mb/total;
   b.x+=nx*overlap*ma/total;b.y+=ny*overlap*ma/total;
   const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
   if(rel<0){
    const impulse=-1.05*rel/(1/ma+1/mb);
    a.vx-=impulse*nx/ma;a.vy-=impulse*ny/ma;
    b.vx+=impulse*nx/mb;b.vy+=impulse*ny/mb;
   }else{a.vx-=nx*.55;a.vy-=ny*.55;b.vx+=nx*.55;b.vy+=ny*.55}
   a.speed=(a.speed||0)*.65;b.speed=(b.speed||0)*.65;
  }
 }
 for(const c of fleet){
  c.x+=c.vx*dt*15;c.y+=c.vy*dt*15;
  const drag=Math.pow(.87,dt*20);c.vx*=drag;c.vy*=drag;
  c.x=clamp(c.x,40,WORLD-40);c.y=clamp(c.y,40,WORLD-40);
 }
 if(player.inCar){
  const own=player.inCar;own.vx=own.vx||0;own.vy=own.vy||0;
  for(const other of fleet){
   if(other===own||other.isPolice)continue;
   const dx=other.x-own.x,dy=other.y-own.y,d=Math.hypot(dx,dy)||.001;
   const limit=(Math.max(own.w||48,own.h||27)+Math.max(other.w||48,other.h||27))*.36;
   if(d<limit){
    const nx=dx/d,ny=dy/d,overlap=limit-d;
    const ma=own.mass||1,mb=other.mass||1;
    own.x-=nx*overlap*.55;own.y-=ny*overlap*.55;
    other.x+=nx*overlap*.45;other.y+=ny*overlap*.45;
    // نقل زخم أقوى مع الشرطة
    const kick=other.isPolice?2.6:1.8;
    own.vx-=nx*kick*(mb/(ma+mb));own.vy-=ny*kick*(mb/(ma+mb));
    other.vx+=nx*kick*(ma/(ma+mb));other.vy+=ny*kick*(ma/(ma+mb));
    own.speed=(own.speed||0)*.48;
    if(other.isPolice){
     other.speed=(other.speed||0)*.55;
     other.angle+=nx*0.04*(Math.random()<.5?-1:1);
     // نجمة واحدة بس لو مفيش مطاردة
     if(player.wanted===0&&Math.abs(own.speed||0)>1.2&&(!other._ramCD||other._ramCD<=0)){
      other._ramCD=2.2;
      forceWantedStar('🚔 صدمة شرطة — نجمة واحدة');
      other.chase=true;other.patrol=false;
     }else if(other._ramCD==null||other._ramCD<=0){
      other._ramCD=1.5;
      other.chase=true;other.patrol=false;
     }
    }
   }
  }
 }
}


/* ===== فيزياء الشرطة: كبسولة (دايرتين) + تصادم بزخم + دوران + ضرر حسب قوة الخبطة ===== */
function _vk(c){return(c.isPolice&&c.chase&&!c.patrol&&!c.block)?.3:1}
function _vel(c){const k=_vk(c),sp=(c.speed||0)*k,vx=(c.vx||0)*.2,vy=(c.vy||0)*.2;return{x:Math.cos(c.angle||0)*sp+vx,y:Math.sin(c.angle||0)*sp+vy}}
function _setVel(c,v){
 const k=_vk(c),ca=Math.cos(c.angle||0),sa=Math.sin(c.angle||0);
 const along=v.x*ca+v.y*sa;
 c.speed=clamp(along/k,-3,8);
 c.vx=(v.x-ca*along)/.2;c.vy=(v.y-sa*along)/.2;
}
function _caps(c){
 const a=c.angle||0,ca=Math.cos(a),sa=Math.sin(a),o=Math.max(0,((c.w||48)-(c.h||27))/2);
 return[{x:c.x+ca*o,y:c.y+sa*o},{x:c.x-ca*o,y:c.y-sa*o}];
}
function policePhysics(dt){
 const fleet=[...police,...cars];
 const pc=player.inCar;
 for(let i=0;i<police.length;i++){
  const a=police[i];
  if(a.health<=0)continue;
  for(let j=0;j<fleet.length;j++){
   const b=fleet[j];
   if(b===a||b.health<=0||b.explodeTimer!=null)continue;
   if(b.isPolice&&police.indexOf(b)<=i&&police.indexOf(b)>=0)continue; // كل زوج مرة
   if(a.block&&b.block)continue;
   const reach=((a.w||50)+(b.w||48))*.55;
   if(Math.abs(a.x-b.x)>reach||Math.abs(a.y-b.y)>reach)continue;
   const ra=(a.h||28)*.5,rb=(b.h||28)*.5;
   const ca=_caps(a),cb=_caps(b);
   let pen=0,n=null,px=0,py=0;
   for(const u of ca)for(const v of cb){
    const dx=v.x-u.x,dy=v.y-u.y,d=Math.hypot(dx,dy)||.001,o=ra+rb-d;
    if(o>pen){pen=o;n={x:dx/d,y:dy/d};px=(u.x+v.x)/2;py=(u.y+v.y)/2}
   }
   if(!n)continue;
   const ima=a.block?0:1/(a.mass||1.35),imb=b.block?0:1/(b.mass||1);
   const isum=ima+imb;if(isum<=0)continue;
   // فصل المراكز بنسبة الكتلة
   a.x-=n.x*pen*ima/isum;a.y-=n.y*pen*ima/isum;
   b.x+=n.x*pen*imb/isum;b.y+=n.y*pen*imb/isum;
   const va=_vel(a),vb=_vel(b);
   const vn=(vb.x-va.x)*n.x+(vb.y-va.y)*n.y;
   if(vn>=0)continue; // بيبعدوا عن بعض
   const impact=-vn;
   const e=.42,j2=-(1+e)*vn/isum;
   va.x-=j2*ima*n.x;va.y-=j2*ima*n.y;
   vb.x+=j2*imb*n.x;vb.y+=j2*imb*n.y;
   if(!a.block)_setVel(a,va);
   if(!b.block)_setVel(b,vb);
   // دوران: الخبطة بعيد عن المركز بتلف العربية (PIT maneuver)
   const spin=(c,sign)=>{
    if(c.block)return;
    const rx=px-c.x,ry=py-c.y;
    const torque=(rx*n.y-ry*n.x)*sign;
    c.angle+=clamp(torque*j2/((c.mass||1)*420),-.32,.32);
   };
   spin(a,-1);spin(b,1);
   // أثر: شرر + اهتزاز + صوت
   if(impact>.75){
    for(let k=0;k<Math.min(8,2+impact*2|0);k++)particles.push({x:px+rand(-4,4),y:py+rand(-4,4),life:.28,max:.28,color:k%2?'#fde047':'#e2e8f0',size:rand(1.5,3.5)});
    if(!a._hitCD||a._hitCD<=0){a._hitCD=.18;sfxHit()}
    if(a===police[0]||b===pc||a===pc)shake=Math.max(shake,Math.min(5,impact*1.1));
   }
   // ضرر حسب قوة الخبطة وكتلة الطرف التاني
   if(impact>1.1&&(!a._dmgCD||a._dmgCD<=0)){
    a._dmgCD=.35;
    const dmgA=(impact-.8)*7*(b.block?1.4:(b.mass||1)/(a.mass||1.35));
    const dmgB=(impact-.8)*5.6*((a.mass||1.35)/(b.mass||1));
    if(!a.block)damageTarget(a,Math.min(26,dmgA));
    if(b.isPolice){if(!b.block)damageTarget(b,Math.min(26,dmgB))}
    else if(b===pc){
     b.health-=Math.min(14,dmgB*.7);b.flash=.3;
     if(b.health<=0&&b.explodeTimer==null){b.health=0;b.explodeTimer=3.2;b.speed=0;b.smokeTimer=0;notify('🔥 العربية ولعت! اطلع بسرعة قبل ما تنفجر!')}
    }else{b.health-=Math.min(20,dmgB);b.flash=.3;if(b.health<=0&&b.explodeTimer==null){b.health=0;b.explodeTimer=2.2;b.speed=0;b.smokeTimer=0}}
   }
   // الشرطة تتحول لمطاردة لو اتخبطت
   if(!a.block&&!a.chase&&player.wanted>0){a.chase=true;a.patrol=false}
  }
  if(a._hitCD>0)a._hitCD-=dt;
  if(a._dmgCD>0)a._dmgCD-=dt;
 }
}

function update(dt){
 perfTick++;
 elapsed+=dt;
 if(toastTimer>0&&(toastTimer-=dt)<=0){const toast=document.getElementById('toast');toast.style.display='none';toast.classList.remove('show');}

 let ix=input.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let iy=input.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag}
 const moving=mag>.08;
 if(moving)player.angle=Math.atan2(iy,ix);

 if(player.inCar){
  const c=player.inCar;
  c.vx=c.vx||0;c.vy=c.vy||0;
  // Steering has weight now: cars turn progressively instead of snapping instantly.
  const oldAngle=c.angle;
  const desiredAngle=moving?Math.atan2(iy,ix):c.angle;

   }else{p.x=nx;p.y=ny}
   stayInLane(p);
   if(carHitsBuilding(p.x,p.y,22,14)||!isOnRoad(p.x,p.y,2)){
    const pos=spawnOnLane(ox,oy,p.angle);p.x=pos.x;p.y=pos.y;p.speed*=0.5;
   }
   p.vx*=0.82;p.vy*=0.82;
   p.x=clamp(p.x,50,WORLD-50);p.y=clamp(p.y,50,WORLD-50);
   continue;
  }

  // ── مطاردة بفيزياء حقيقية (تسارع + انزلاق + اصطدام) ──
  const preferX=Math.abs(dx)>=Math.abs(dy);
  let targetAngle=preferX?(dx>0?0:Math.PI):(dy>0?Math.PI/2:-Math.PI/2);
  if(d<180)targetAngle=Math.atan2(dy,dx);

  let da=targetAngle-p.angle;
  while(da>Math.PI)da-=Math.PI*2;
  while(da<-Math.PI)da+=Math.PI*2;
  // لف حسب السرعة (أبطأ وأوضح)
  const turnRate=clamp(2.1-Math.abs(p.speed)*0.18,0.9,2.4);

  // تباعد عن شرطة تانية

  if(Math.abs(da)>0.4){
   p.vx+=-Math.sin(p.angle)*p.speed*dt*0.8;
   p.vy+=Math.cos(p.angle)*p.speed*dt*0.8;
   p.speed*=1-dt*0.35;
  }

  const ox=p.x,oy=p.y;
  let nx=p.x+Math.cos(p.angle)*p.speed*dt*18+p.vx*dt*12+sepX*dt*40;
  let ny=p.y+Math.sin(p.angle)*p.speed*dt*18+p.vy*dt*12+sepY*dt*40;

  if(carHitsBuilding(nx,oy,22,14)){
   nx=ox;p.speed*=-0.25;p.vx*=-0.45;
   if(Math.abs(p.speed)>1.5){
    for(let i=0;i<6;i++)particles.push({x:p.x+rand(-10,10),y:p.y+rand(-8,8),life:.25,max:.25,color:'#94a3b8',size:rand(2,5)});
   }
  }
  if(carHitsBuilding(nx,ny,22,14)||!isOnRoad(nx,ny,6)){
   // دور على محور شارع
   const opts=[0,Math.PI/2,Math.PI,-Math.PI/2];
   let best=null,bestScore=1e9;
   for(const ang of opts){
    const tx=p.x+Math.cos(ang)*Math.abs(p.speed)*dt*18;
    const ty=p.y+Math.sin(ang)*Math.abs(p.speed)*dt*18;
    if(carHitsBuilding(tx,ty,22,14)||!isOnRoad(tx,ty,6))continue;
    const sc=Math.hypot(player.x-tx,player.y-ty);
    if(sc<bestScore){bestScore=sc;best={x:tx,y:ty,ang}}
   }
   if(best){nx=best.x;ny=best.y;p.angle=best.ang;p.speed=Math.abs(p.speed)*0.7}
   else{
    const sn=snapToRoad(p.x,p.y);
    nx=sn.x;ny=sn.y;p.speed*=0.4;p.vx*=0.3;p.vy*=0.3;

  }

  if(player.wanted>0&&d<420&&d>90&&p.shoot<=0){
   p.shoot=rand(1.0,2.0);

function drawRoadPolish(){
 const left=Math.max(0,Math.floor((camera.x-100)/BLOCK)-1), right=Math.min(WORLD/BLOCK,Math.ceil((camera.x+W+100)/BLOCK)+1);
 const top=Math.max(0,Math.floor((camera.y-100)/BLOCK)-1), bottom=Math.min(WORLD/BLOCK,Math.ceil((camera.y+H+100)/BLOCK)+1);
 // خطوط الحارات البيضاء المتقطعة بين التقاطعات
 ctx.save();ctx.strokeStyle='#e2e8f02b';ctx.lineWidth=1.6;ctx.setLineDash([13,17]);
 for(let gx=left;gx<=right;gx++){
  const x=gx*BLOCK;
  for(let y=top*BLOCK+72;y<bottom*BLOCK;y+=1){
   const next=Math.floor(y/BLOCK)*BLOCK+BLOCK-72;
   if(next>y){ctx.beginPath();ctx.moveTo(x-roadWidthAt(gx)*.3,y);ctx.lineTo(x-roadWidthAt(gx)*.3,Math.min(next,y+160));ctx.stroke();}
   y=Math.max(y,next-1);
  }
 }
 for(let gy=top;gy<=bottom;gy++){
  const y=gy*BLOCK;
  for(let x=left*BLOCK+72;x<right*BLOCK;x+=1){
   const next=Math.floor(x/BLOCK)*BLOCK+BLOCK-72;
   if(next>x){ctx.beginPath();ctx.moveTo(x,y-roadWidthAt(gy)*.3);ctx.lineTo(Math.min(next,x+160),y-roadWidthAt(gy)*.3);ctx.stroke();}
   x=Math.max(x,next-1);
  }
 }
 ctx.setLineDash([]);
 // فتحات صرف وعلامات الطريق في الأجزاء الظاهرة
 for(let gx=left;gx<=right;gx++)for(let gy=top;gy<=bottom;gy++){
  const x=gx*BLOCK,y=gy*BLOCK;
  if(inView(x+ROAD_W*.31,y+ROAD_W*.31,25)){
   ctx.fillStyle='#0b1017';ctx.beginPath();ctx.ellipse(x+ROAD_W*.31,y+ROAD_W*.31,7,4,.25,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#64748b55';ctx.lineWidth=1;
   for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(x+ROAD_W*.31-5,y+ROAD_W*.31+k);ctx.lineTo(x+ROAD_W*.31+5,y+ROAD_W*.31+k);ctx.stroke();}
  }
 }
 ctx.restore();
}
function drawWetRoadReflections(){

 const left=Math.max(0,Math.floor((camera.x-80)/BLOCK)-1),right=Math.min(WORLD/BLOCK,Math.ceil((camera.x+W+80)/BLOCK)+1);
 const top=Math.max(0,Math.floor((camera.y-80)/BLOCK)-1),bottom=Math.min(WORLD/BLOCK,Math.ceil((camera.y+H+80)/BLOCK)+1);
 ctx.save();
 // Thin wet sheen along the road edges.

 ctx.fillStyle='#93c5fd';

 }
 // Puddles are anchored to the world, so they don't shimmer as the camera moves.
 ctx.globalAlpha=.65;

   ctx.strokeStyle='#bae6fd77';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(px-1,py-1,rx*.68,ry*.45,-.18,Math.PI*1.05,Math.PI*1.85);ctx.stroke();

function drawNightVehicleLights(){
 if(!(dayPhase>0.55&&dayPhase<0.95))return;
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const c of [...cars,...police]){
  if(c.block||c.explodeTimer!=null||!inView(c.x,c.y,160))continue;
  const mine=c===player.inCar;
  if(!(mine||(c.speed||0)>.25))continue;
  const a=c.angle||0,ca=Math.cos(a),sa=Math.sin(a);
  const isMoto=c.type==='moto';
  const L=mine?118:78,half=mine?.2:.17,al=mine?.36:.2;
  // مواضع الفوانيس الفعلية على الجسم (نفس مكان الفانوس المرسوم)
  const fx=c.w/2-1,fy=isMoto?[0]:[-(c.h/2-6.5),(c.h/2-6.5)];
  for(const ly of (isMoto?[0]:fy)){
   const hx=c.x+ca*fx-sa*ly,hy=c.y+sa*fx+ca*ly;
   const g=ctx.createLinearGradient(hx,hy,hx+ca*L,hy+sa*L);
   g.addColorStop(0,'rgba(255,244,190,'+al+')');g.addColorStop(.55,'rgba(255,236,160,'+(al*.45)+')');g.addColorStop(1,'rgba(255,230,150,0)');
   ctx.fillStyle=g;
   ctx.beginPath();ctx.moveTo(hx,hy);
   ctx.lineTo(hx+Math.cos(a-half)*L,hy+Math.sin(a-half)*L);
   ctx.lineTo(hx+Math.cos(a+half)*L,hy+Math.sin(a+half)*L);
   ctx.closePath();ctx.fill();
   ctx.fillStyle='rgba(255,247,214,.85)';ctx.beginPath();ctx.arc(hx,hy,1.8,0,Math.PI*2);ctx.fill();
  }
  // أضواء خلفية في مكانها الحقيقي
  const bx=-c.w/2+1;
  ctx.fillStyle=c.braking||(mine&&(keys[' ']||keys['x']))?'rgba(255,40,60,.85)':'rgba(255,50,70,.5)';
  for(const ly of (isMoto?[0]:[-c.h*.24,c.h*.24])){
   ctx.beginPath();ctx.arc(c.x+ca*bx-sa*ly,c.y+sa*bx+ca*ly,2.1,0,Math.PI*2);ctx.fill();
  }
 }
 ctx.restore();
}

 /* HD wet road — لمعان ليل/مطر */

const FPSM={on:false,fr:0,acc:0,fps:0,worst:0,spikes:0,hist:[],lastT:0};
try{FPSM.on=localStorage.getItem('fcFps')!=='0'}catch(e){}
function fpsTick(t){
 if(FPSM.lastT){
  const d=t-FPSM.lastT;
  FPSM.fr++;FPSM.acc+=d;
  if(d>FPSM.worst)FPSM.worst=d;
  if(d>58){FPSM.spikes++;FPSM.hist.push({at:elapsed,ms:d});if(FPSM.hist.length>5)FPSM.hist.shift()}
  if(FPSM.acc>=1000){FPSM.fps=Math.round(FPSM.fr*1000/FPSM.acc);FPSM.fr=0;FPSM.acc=0;fpsShow();FPSM.worstShown=FPSM.worst;FPSM.worst=0}
 }
 FPSM.lastT=t;
}
function fpsShow(){
 let el=document.getElementById('fpsBox');
 if(!FPSM.on){if(el)el.style.display='none';return}
 if(!el){
  el=document.createElement('div');el.id='fpsBox';
  el.innerHTML='<i></i><b></b><span></span>';
  document.body.appendChild(el);
 }
 el.style.display='flex';
 const lvl=FPSM.fps>=27?'ok':FPSM.fps>=18?'mid':'bad';
 if(el.dataset.l!==lvl)el.dataset.l=lvl;
 el.children[1].textContent=FPSM.fps+' FPS';
 el.children[2].textContent=FPSM.spikes?('· '+FPSM.spikes):'';
 el.title='أسوأ فريم: '+Math.round(FPSM.worstShown||0)+'ms';
}
const FIX={step:1/60,acc:0};
addEventListener('pointerdown',()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}},{once:true});
let _fcPerfOn=false;
function frame(t){
 // سقف الفريمات حسب الإعدادات (60 افتراضي، 30 اختياري)
 if(t-last<(gameSettings.fps30?30:0)){requestAnimationFrame(frame);return}
 fpsTick(t);
 if(!_fcPerfOn){_fcPerfOn=true;
  // ألغِ التوهج الثقيل (shadowBlur) على الكانفاس
  try{Object.defineProperty(ctx,'shadowBlur',{get(){return 0},set(v){},configurable:true})}catch(e){}
  document.body.classList.add('lowp');
 }
 if(!gameSettings.shake)shake=0;

 // خطوة ثابتة 1/60: الكود بتاع العربيات محسوب بالفريم، فلازم الخطوة تفضل ثابتة
 // عشان سرعة اللعبة تفضل زي ما هي حتى لو الموبايل رسم 30 فريم أو أقل
 const real=Math.min(.1,(t-last)/1000||0);last=t;
 try{
  if(document.getElementById('gameover').style.display!=='flex'&&
     document.getElementById('modal').style.display!=='flex'){
   FIX.acc+=real;
   let n=0;
   while(FIX.acc>=FIX.step&&n<4){update(FIX.step);FIX.acc-=FIX.step;n++}
   if(n===4)FIX.acc=0;
  }else FIX.acc=0;
  render();
 }catch(err){
  console.error(err);
  let panel=document.getElementById('runtimeError');
  if(!panel){
   panel=document.createElement('div');panel.id='runtimeError';panel.dir='rtl';
   panel.style.cssText='position:absolute;left:12px;right:12px;top:42%;z-index:999;background:#3b1018;color:#fff;border:2px solid #ff5364;border-radius:12px;padding:14px;font:14px/1.7 system-ui;max-height:35%;overflow:auto';
   document.body.appendChild(panel);
  }
  panel.textContent='خطأ: '+(err&&(err.stack||err.message)||err);
 }
 requestAnimationFrame(frame);
}

function mixHex(h,a){const n=parseInt(h.slice(1,7),16);let r=n>>16,g=(n>>8)&255,b=n&255;
 if(a>=0){r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a}else{r*=1+a;g*=1+a;b*=1+a}
 return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}
/* vector map icons, centred on 0,0, about 20px wide */
function markerIcon(k,fg,cut){
 fg=fg||'#fff';cut=cut||'#0f172a';
 ctx.save();ctx.fillStyle=fg;ctx.strokeStyle=fg;ctx.lineCap='round';ctx.lineJoin='round';
 switch(k){
 case 'fuel':
  ctx.beginPath();ctx.roundRect(-6.5,-8,9,15,1.8);ctx.fill();
  ctx.fillStyle=cut;ctx.fillRect(-4.6,-6,5.2,4.2);ctx.fillStyle=fg;
  ctx.fillRect(-8,7,12,2);
  ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(2.5,-3.5);ctx.lineTo(6.2,-3.5);ctx.lineTo(6.2,4.5);ctx.stroke();
  ctx.beginPath();ctx.arc(6.2,5.4,1.6,0,Math.PI*2);ctx.fill();
  break;
 case 'ramp':
  ctx.lineWidth=2.8;
  ctx.beginPath();ctx.moveTo(-7,-1);ctx.lineTo(0,-8);ctx.lineTo(7,-1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-7,6);ctx.lineTo(0,-1);ctx.lineTo(7,6);ctx.stroke();
  break;
 case 'star':
  ctx.beginPath();
  for(let i=0;i<10;i++){const r=i%2?4.3:10,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r+.6);}
  ctx.closePath();ctx.fill();break;
 case 'dollar':
  ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);break;
 case 'cam':
  ctx.beginPath();ctx.roundRect(-9,-4,18,12,2.5);ctx.fill();ctx.fillRect(-4,-7.5,8,4);
  ctx.fillStyle=cut;ctx.beginPath();ctx.arc(0,2,4.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,2,2.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=cut;ctx.fillRect(5.4,-2.4,2.4,1.8);break;
 case 'home':
  ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(0,-9.5);ctx.lineTo(10,0);ctx.lineTo(7.2,0);ctx.lineTo(7.2,8.5);ctx.lineTo(-7.2,8.5);ctx.lineTo(-7.2,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=cut;ctx.fillRect(-2,2.5,4,6);break;
 case 'bag':
  ctx.beginPath();ctx.ellipse(0,2.8,8.2,7,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-3.4,-3.5);ctx.lineTo(-5.6,-9);ctx.quadraticCurveTo(0,-6.2,5.6,-9);ctx.lineTo(3.4,-3.5);ctx.closePath();ctx.fill();
  ctx.fillStyle=cut;ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,3.6);break;
 case 'bank':
  ctx.beginPath();ctx.moveTo(-10,-3);ctx.lineTo(0,-10);ctx.lineTo(10,-3);ctx.closePath();ctx.fill();
  for(const x of [-7,-2.4,2.4,7])ctx.fillRect(x-1.3,-1,2.6,8);
  ctx.fillRect(-10,8,20,2.2);break;
 case 'wrench':
  ctx.rotate(Math.PI/4);
  ctx.beginPath();ctx.roundRect(-2,-3,4,14,2);ctx.fill();
  ctx.beginPath();ctx.arc(0,-6.5,5.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=cut;ctx.fillRect(-1.8,-13,3.6,6.5);break;
 case 'crosshair':
  ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,6.3,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,-4);ctx.moveTo(0,10);ctx.lineTo(0,4);ctx.moveTo(-10,0);ctx.lineTo(-4,0);ctx.moveTo(10,0);ctx.lineTo(4,0);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,1.7,0,Math.PI*2);ctx.fill();break;
 case 'flag':
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,-9);ctx.lineTo(-5,9);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-4,-8);ctx.lineTo(8,-4.5);ctx.lineTo(-4,0);ctx.closePath();ctx.fill();break;
 case 'person':
  ctx.beginPath();ctx.arc(0,-5,3.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-7.5,9);ctx.quadraticCurveTo(-7.5,.8,0,.8);ctx.quadraticCurveTo(7.5,.8,7.5,9);ctx.closePath();ctx.fill();break;
 case 'exclaim':
  ctx.beginPath();ctx.roundRect(-1.9,-8,3.8,10.5,1.9);ctx.fill();
  ctx.beginPath();ctx.arc(0,6.2,2.2,0,Math.PI*2);ctx.fill();break;
 }
 ctx.restore();
}
/* glossy floating map badge with pulsing ground ring */
function proBadge(x,y,col,kind){
 const t=elapsed,ph=(t*.8+x*.003)%1,lite=PERF.lite;
 ctx.save();ctx.translate(x,y);
 if(!lite){const g=ctx.createRadialGradient(0,0,6,0,0,42);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,42,0,Math.PI*2);ctx.fill();}
 else{ctx.fillStyle=col+'26';ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fill();}
 ctx.globalAlpha=(1-ph)*.6;ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(0,0,18+ph*20,0,Math.PI*2);ctx.stroke();
 ctx.globalAlpha=.9;ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.lineDashOffset=-t*8;ctx.beginPath();ctx.arc(0,0,27,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
 ctx.globalAlpha=1;
 const bob=Math.sin(t*3+x*.01)*2.2;
 ctx.fillStyle='#00000066';ctx.beginPath();ctx.ellipse(1,17,11-bob*.3,4,0,0,Math.PI*2);ctx.fill();
 ctx.translate(0,-3+bob);
 const g2=ctx.createRadialGradient(-5,-7,2,0,0,19);g2.addColorStop(0,mixHex(col,.45));g2.addColorStop(.55,col);g2.addColorStop(1,mixHex(col,-.4));
 ctx.fillStyle=g2;ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();
 ctx.lineWidth=2.6;ctx.strokeStyle='#ffffffee';ctx.stroke();
 ctx.lineWidth=1;ctx.strokeStyle='#00000033';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#ffffff30';ctx.beginPath();ctx.ellipse(-4,-9,8.5,4.5,-.35,0,Math.PI*2);ctx.fill();
 ctx.shadowColor='#0006';
 markerIcon(kind,'#fff',mixHex(col,-.25));
 ctx.restore();
}

const MK={'\u26fd':'fuel','\u25b2':'ramp','\u2605':'star','$':'dollar','\u25c9':'cam','\ud83c\udfe0':'home','\ud83d\udcb0':'bag'};

function extras2(dt){

 if(c){

   if(!exCd.msg){notify('⛽ بتتزود بنزين ($0.8 للوحدة)');exCd.msg=3}

   X.sold++;addCash(price);notify('💰 السوق السودا: بعت العربية بـ $'+price);sfxPickup();
  }
 }else fuelHud.textContent='';
 if(!c&&dist(player.x,player.y,HOME[0],HOME[1])<45&&!exCd.home){
  player.health=100;player.armor=Math.min(100,player.armor+25);saveGame(true);

 }
 extras3(dt);storyNpc();armoredTick();extras4(dt);
 fogT-=dt;
 if(fogT<=0){fogOn=!fogOn;fogT=fogOn?35:rand(70,140);if(fogOn)notify('🌫 ضباب كثيف — خلّي بالك')}

let exStreak=0,exStreakT=0,exKills=totalKills,exAtm=0,exCam=0;
const shells=[];
function tankFire(dt){
 for(const p of police){
  if(!p.tank||p.health<=0)continue;
  p._sc=(p._sc==null?2:p._sc)-dt;
  if(p._sc<=0&&dist(p.x,p.y,player.x,player.y)<460){p._sc=3.6;const a=Math.atan2(player.y-p.y,player.x-p.x);shells.push({x:p.x+Math.cos(a)*40,y:p.y+Math.sin(a)*40,vx:Math.cos(a)*340,vy:Math.sin(a)*340,t:1.4});sfxExplode()}
 }
 for(let i=shells.length-1;i>=0;i--){
  const q=shells[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;
  if(q.t<=0||dist(q.x,q.y,player.x,player.y)<22||buildings.some(b=>q.x>b.x&&q.x<b.x+b.w&&q.y>b.y&&q.y<b.y+b.h)){explode(q.x,q.y,55);shells.splice(i,1)}
 }
}
function extras4(dt){
 tankFire(dt);perfTick2();
 exAtm=Math.max(0,exAtm-dt);exCam=Math.max(0,exCam-dt);exStreakT-=dt;if(exStreakT<=0)exStreak=0;
 if(totalKills>exKills){exStreak+=totalKills-exKills;exStreakT=6;if(exStreak>=2){const b=exStreak*20;addCash(b);floatText(player.x,player.y-34,'x'+exStreak+' +$'+b,'#fbbf24')}}
 exKills=totalKills;
 const c=player.inCar;
 if(!c&&!exAtm)for(const a of ATMS)if(dist(player.x,player.y,a[0],a[1])<38){exAtm=10;const g=150+(Math.random()*300|0);addCash(g);raiseWanted(1);notify('💳 سرقت صراف +$'+g);sfxPickup();break}
 if(c&&!exCam&&Math.abs(c.speed)>3.2)for(const k of CAMS)if(dist(c.x,c.y,k[0],k[1])<45){exCam=6;player.cash=Math.max(0,player.cash-150);notify('📸 كاميرا مرور! مخالفة -$150');updateUI();break}
 document.getElementById('missionBtn').classList.toggle('hot',!story.active&&!mission.active&&(X.ch||0)<CH.length);
}
function drawArrow(){
 let tp=null;
 if(story.active){const st=curStage();tp=st&&st.pos?st.pos():null}
 else if(!mission.active&&(X.ch||0)<CH.length)tp={x:NPC[0],y:NPC[1]};
 if(!tp)return;
 const sx=tp.x-camera.x,sy=tp.y-camera.y;
 if(sx>40&&sx<W-40&&sy>110&&sy<H-40)return;
 const cx=W/2,cy=H/2,dx=sx-cx,dy=sy-cy;
 const t=Math.min((W/2-34)/Math.abs(dx||1e-6),(H/2-120)/Math.abs(dy||1e-6));
 const ax=cx+dx*t,ay=cy+dy*t,ang=Math.atan2(dy,dx);
 ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);
 const pu=1+Math.sin(elapsed*6)*.06;
 ctx.fillStyle='#0b1220dd';ctx.beginPath();ctx.arc(0,0,17*pu,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#f43f5e';ctx.lineWidth=2.5;ctx.stroke();
 ctx.fillStyle='#f43f5e';ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-5.5,-8);ctx.lineTo(-2.5,0);ctx.lineTo(-5.5,8);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.rotate(-ang);
 ctx.fillStyle='#0b1220dd';ctx.beginPath();ctx.roundRect(-18,-40,36,16,8);ctx.fill();ctx.strokeStyle='#ffffff40';ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(Math.round(dist(player.x,player.y,tp.x,tp.y)/10)+'m',0,-31.5);ctx.restore();
}

 ctx.fillStyle=c.flash>0?'#ff9a9a':'#dc2626';ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,5);ctx.fill();
 ctx.fillStyle='#b91c1c';ctx.fillRect(-w/2+2,-h/2+2,w*.62,h-4);

 ctx.fillStyle='#9ca3af';for(let x=-w/2+7;x<-w/2+4+w*.56;x+=6)ctx.fillRect(x,-h*.2,1.5,h*.4);
 ctx.fillStyle='#fef9c3';ctx.fillRect(-w/2+3,-h/2+3,w*.6,2);ctx.fillRect(-w/2+3,h/2-5,w*.6,2);
 ctx.fillStyle='#ef4444';ctx.beginPath();ctx.roundRect(w*.17,-h/2+1.5,w*.31,h-3,5);ctx.fill();
 ctx.fillStyle='#7dd3fcbb';ctx.beginPath();ctx.roundRect(w*.34,-h*.36,w*.11,h*.72,3);ctx.fill();
 ctx.fillStyle='#0f172a';ctx.beginPath();ctx.roundRect(w*.2,-h*.42,5,h*.84,2);ctx.fill();
 ctx.shadowBlur=night?14:8;
 ctx.shadowColor='#ef4444';ctx.fillStyle=blink?'#ff4d4d':'#7f1d1d';ctx.beginPath();ctx.roundRect(w*.2+.5,-h*.4,4,h*.38,1.5);ctx.fill();
 ctx.shadowColor='#ffffff';ctx.fillStyle=blink?'#e2e8f0':'#475569';ctx.beginPath();ctx.roundRect(w*.2+.5,h*.02,4,h*.38,1.5);ctx.fill();
 ctx.shadowBlur=0;

function spawnEmergency(typeId){
 const t=CAR_TYPES.find(v=>v.id===typeId);if(!t)return;
 let p=randomRoadPos();
 for(let i=0;i<20&&dist(p.x,p.y,player.x,player.y)<400;i++)p=randomRoadPos();
 const ang=roadAngle(),pos=spawnOnLane(p.x,p.y,ang);
 cars.push({x:pos.x,y:pos.y,w:t.w,h:t.h,type:typeId,angle:ang,speed:2,maxSpeed:t.max[1]+.8,color:t.colors[0],health:typeId==='firetruck'?160:120,isPolice:false,stolen:false,explodeTimer:null,smokeTimer:0,vx:0,vy:0,mass:t.mass,flash:0,turnTimer:3,plate:makePlate(),siren:true});
}
let emT=25,emSirenT=0,ltT=rand(8,18),ltFlash=0,ltThunder=-1,musicT=0,musicStep=0,hgCD=0;
function emergencyTick(dt){
 emT-=dt;
 if(emT<=0){
  emT=rand(50,90);
  if(cars.filter(c=>c.siren).length<3)spawnEmergency(Math.random()<.5?'firetruck':'ambulance');
 }
 emSirenT-=dt;
 if(emSirenT<=0){
  emSirenT=.5;
  let best=1e9;
  for(const c of cars)if((c.siren||c.type==='ambulance'||c.type==='firetruck')&&c.explodeTimer==null){const d=dist(c.x,c.y,player.x,player.y);if(d<best)best=d}
  if(best<380){emSirenT=.5;const v=.035*(1-best/380);musicStep^=0;beep((Math.floor(elapsed*2)%2)?820:600,.22,'sine',v)}
 }
}
function weatherFx2(dt){
 if(isRaining){
  ltT-=dt;
  if(ltT<=0){ltT=rand(8,22);ltFlash=1;ltThunder=rand(.4,1.6)}
 }
 if(ltFlash>0)ltFlash=Math.max(0,ltFlash-dt*2.6);
 if(ltThunder>=0){ltThunder-=dt;if(ltThunder<0){beep(48,.7,'sawtooth',.09);beep(72,.5,'square',.05);shake=Math.max(shake,3);ltThunder=-1}}
}

 if(ltFlash>0){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='rgba(240,248,255,'+(ltFlash*.5)+')';ctx.fillRect(0,0,W,H)}
};

];

 return; // الراديو اتشال

/* ركن العربيات في الملجأ */
const CAR_AR={sedan:'سيدان',sports:'رياضية',van:'فان',taxi:'تاكسي',moto:'موتوسيكل',truck:'شاحنة',pickup:'بيك أب',icecream:'آيس كريم',ambulance:'إسعاف',armored:'مدرعة',firetruck:'مطافي',bus:'أتوبيس'};
let homeCars=[];
try{homeCars=JSON.parse(localStorage.getItem('freeCityHome')||'[]')}catch(e){}
const persistHome=()=>{try{localStorage.setItem('freeCityHome',JSON.stringify(homeCars))}catch(e){}};
function openHomeGarage(){
 const modal=document.getElementById('modal'),box=document.getElementById('modalBox');
 modal.style.display='flex';
 const c=player.inCar;
 box.innerHTML='<h2>🏠 جراج الملجأ</h2><p class="hint">بتركن العربيات هنا وتلاقيها لما تفتح اللعبة تاني ('+homeCars.length+'/4).</p>'
  +(c?'<button class="menuBtn gold" id="hgPark">🅿 ركن العربية الحالية ('+(CAR_AR[c.type]||c.type)+')</button>':'')
  +homeCars.map((d,i)=>'<button class="menuBtn" id="hgOut'+i+'">🚗 اطلع '+(CAR_AR[d.type]||d.type)+' · '+Math.ceil(d.health)+'%</button>').join('')
  +(homeCars.length?'':'<p>مفيش عربيات متركنة.</p>')
  +'<button class="menuBtn secondary" id="hgClose">إغلاق</button>';
 document.getElementById('hgClose').onclick=()=>modal.style.display='none';
 const pk=document.getElementById('hgPark');
 if(pk)pk.onclick=()=>{
  if(c.story){notify('مينفعش تركن عربية المهمة');return}
  if(homeCars.length>=4){notify('الجراج مليان');return}
  homeCars.push({type:c.type,color:c.color,health:c.health,plate:c.plate,maxSpeed:c.maxSpeed,w:c.w,h:c.h,mass:c.mass,fuel:c.fuel});
  player.inCar=null;
  const i=cars.indexOf(c);if(i>=0)cars.splice(i,1);
  player.x=HOME[0]-40;player.y=HOME[1];
  persistHome();notify('🅿 العربية اتركنت في الملجأ');sfxPickup();updateUI();modal.style.display='none';
 };
 homeCars.forEach((d,i)=>{document.getElementById('hgOut'+i).onclick=()=>{
  const car={x:HOME[0]-60,y:HOME[1]-20,w:d.w,h:d.h,type:d.type,angle:0,speed:0,maxSpeed:d.maxSpeed,health:d.health,isPolice:false,stolen:true,explodeTimer:null,smokeTimer:0,vx:0,vy:0,mass:d.mass,flash:0,turnTimer:2,plate:d.plate,owned:true,parked:true,color:d.color};
  if(d.fuel!=null)car.fuel=d.fuel;
  cars.push(car);homeCars.splice(i,1);persistHome();notify('🚗 العربية بره الملجأ');sfxPickup();modal.style.display='none';
 }});
}
const _upd2=update;

 emergencyTick(dt);weatherFx2(dt);musicTick(dt);
 if(hgCD>0)hgCD-=dt;
 else if(dist(player.x,player.y,HOME[0],HOME[1])<55&&(player.inCar||homeCars.length)&&document.getElementById('modal').style.display!=='flex'&&document.getElementById('gameover').style.display!=='flex'&&Math.abs(player.inCar?player.inCar.speed||0:0)<2){hgCD=25;openHomeGarage()}
};
/* رسائل احترافية: أيقونة + لون حسب نوع الرسالة */
const _ntf=notify;
notify=function(s){
 _ntf(s);
 const el=document.getElementById('toast');if(!el)return;
 const txt=String(s??'');
 const m=txt.match(/^\s*(\p{Extended_Pictographic}️?(?:‍\p{Extended_Pictographic}️?)*)\s*/u);
 const icon0=m?m[1]:'';
 const body=m?txt.slice(m[0].length):txt;
 let type='info',title='إشعار';
 if(/💥|🔥|❌|🚫|انفجر|ولعت|فشلت|هتنفجر|اتقتلت|فشل|مش كفاية|متقدرش/.test(txt)){type='danger';title='تنبيه مهم'}
 else if(/🚨|🚔|شرطة|إنذار|حاجز|مطلوب|مطاردة|اهرب|⚠|🚧|🌧|🌫/.test(txt)){type='warn';title='تحذير'}
 else if(/✅|🏆|💰|💵|🎁|🎬|\+\$|مبروك|اكتمل|اتصلحت|اتعالجت|اتركنت|تم بنجاح/.test(txt)){type='success';title='تم بنجاح'}
 const col={danger:'#fb7185',success:'#4ade80',warn:'#fbbf24',info:'#7dd3fc'}[type];
 const icon=icon0||{danger:'!',success:'✓',warn:'⚠',info:'✦'}[type];
 el.replaceChildren();
 const w=document.createElement('div');w.className='tw';
 const i=document.createElement('span');i.className='ti';i.setAttribute('aria-hidden','true');i.textContent=icon;
 const content=document.createElement('div');content.className='toastContent';
 const h=document.createElement('span');h.className='toastTitle';h.textContent=title;
 const t=document.createElement('span');t.className='tt';t.textContent=body||txt;
 content.append(h,t);w.append(i,content);el.appendChild(w);
 el.style.setProperty('--tc',col);el.setAttribute('role',type==='danger'||type==='warn'?'alert':'status');
 el.setAttribute('aria-live',type==='danger'||type==='warn'?'assertive':'polite');
 el.className='';void el.offsetWidth;el.className='show '+type;el.style.display='block';toastTimer=3.6;
};

/* تم تعطيل نظام الحوادث المرورية العشوائية بناءً على طلب اللاعب. */

/* تنسيق نصوص القوائم: شيل الإيموجي، افصل السعر/القيمة في كبسولة */
(function(){
 const box=document.getElementById('modalBox');if(!box)return;
 const EMO=/^[\s\p{Extended_Pictographic}️‍★☆✔✅❗]+/u;
 const PRICE=/^(.*?)\s*[—–-]\s*\$?\s*(\d[\d,]*)\s*\$?\s*$/;
 const STATE=/^(.{2,34}?):\s*(.{1,32})$/;
 function pol(){
  const h=box.querySelector('h2');
  if(h&&!h.dataset.pl){h.dataset.pl='1';h.textContent=h.textContent.replace(EMO,'').trim()}
  for(const b of box.querySelectorAll('.menuBtn')){
   if(b.dataset.pl)continue;b.dataset.pl='1';
   if(b.querySelector('.mb-l'))continue;
   let t=b.textContent.replace(EMO,'').replace(/\s+/g,' ').trim();
   let l=t,v='',cls='';
   let m=t.match(PRICE);
   if(m){l=m[1].trim();v='$'+m[2];cls=' price'}
   else if((m=t.match(STATE))){l=m[1].trim();v=m[2].trim()}
   b.textContent='';
   const a=document.createElement('span');a.className='mb-l';a.textContent=l;b.appendChild(a);
   if(v){const c=document.createElement('span');c.className='mb-p'+cls;c.textContent=v;b.appendChild(c)}
  }
 }
 const ob=new MutationObserver(()=>{ob.disconnect();try{pol()}catch(e){}ob.observe(box,{childList:true,subtree:true})});
 ob.observe(box,{childList:true,subtree:true});
})();
requestAnimationFrame(frame);
})();
